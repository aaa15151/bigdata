name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m compileall -q dashboard pipeline/als scripts verification run.py
      - name: Verify saved results without Hadoop or Kafka
        run: python verification/verify_snapshot.py && python verification/verify_extensions.py
      - run: find dashboard/static -name '*.js' ! -name 'echarts.min.js' -exec node --check {} \;
      - run: find pipeline scripts verification -name '*.sh' -exec bash -n {} \;

  live-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -f realtime-service/pom.xml test package